name: Update CABEI opportunities

on:
  schedule:
    # GitHub Actions uses UTC. 00:00 UTC = 08:00 Asia/Taipei.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cabei-opportunities
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache offline translation model
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: cabei-offline-es-zh-v2-${{ runner.os }}

      - name: Install PDF text extractor
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils

      - name: Install offline translation engine
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check "transformers>=4.45,<5" sentencepiece sacremoses opencc-python-reimplemented

      - name: Fetch CABEI data and attachments
        run: node scripts/update-data.mjs

      - name: Translate titles and TOR text to Traditional Chinese
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: python scripts/offline-translate.py

      - name: Commit changed JSON
        shell: bash
        run: |
          if git diff --quiet -- public/data/opportunities.json; then
            echo "CABEI data has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/opportunities.json
          git commit -m "data: update CABEI opportunities"
          git push

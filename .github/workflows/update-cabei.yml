name: Update CABEI opportunities

on:
  push:
    branches: [main]
    paths:
      - "scripts/update-data.mjs"
      - ".github/workflows/update-cabei.yml"
  schedule:
    # GitHub Actions uses UTC. 00:00 UTC = 08:00 Asia/Taipei.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: update-cabei-opportunities
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install PDF text extractor
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils

      - name: Fetch, translate and analyze CABEI data
        env:
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS_MODEL: openai/gpt-4o-mini
        run: node scripts/update-data.mjs

      - name: Commit changed JSON
        shell: bash
        run: |
          if git diff --quiet -- public/data/opportunities.json; then
            echo "CABEI data has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/opportunities.json
          git commit -m "data: update CABEI opportunities"
          git push

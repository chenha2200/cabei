name: Update CABEI opportunities

on:
  push:
    branches: [main]
    paths:
      - "scripts/update-data.mjs"
      - "scripts/offline-translate.py"
      - "scripts/update-projects.mjs"
      - "scripts/translate-projects.py"
      - "scripts/translation_guard.py"
      - "scripts/translation-revisions.json"
      - "scripts/email-status.py"
      - "scripts/opus_backend.py"
      - ".github/workflows/update-cabei.yml"
  schedule:
    # GitHub Actions uses UTC. 00:00 UTC = 08:00 Asia/Taipei.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cabei-opportunities
  cancel-in-progress: true

jobs:
  update:
    outputs:
      data_sha: ${{ steps.commit.outputs.data_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache offline translation model
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: cabei-opus-es-en-zh-v1-${{ runner.os }}

      - name: Install PDF text extractor
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils

      - name: Install offline translation engine
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1"
          python -m pip install --disable-pip-version-check "transformers==4.57.1" sentencepiece sacremoses opencc-python-reimplemented

      - name: Validate offline translation on real procurement samples
        run: python scripts/test-opus-quality.py

      - name: Fetch CABEI data and attachments
        run: |
          node scripts/update-data.mjs
          node scripts/update-projects.mjs

      - name: Translate titles and TOR text to Traditional Chinese
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python scripts/offline-translate.py
          python scripts/translate-projects.py

      - name: Validate translation guard
        run: python scripts/test-translation-guard.py

      - name: Commit changed JSON
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- public/data/opportunities.json public/projects/data/opportunities.json; then
            echo "data_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "CABEI data has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/opportunities.json public/projects/data/opportunities.json
          git commit -m "data: update CABEI opportunities"
          git push
          echo "data_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  email:
    name: Email update result
    needs: update
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.update.outputs.data_sha || github.sha }}
      - name: Test email status logic
        run: python scripts/test-email-status.py
      - name: Send status email
        env:
          UPDATE_RESULT: ${{ needs.update.result }}
          DATA_SHA: ${{ needs.update.outputs.data_sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
        run: python scripts/email-status.py
